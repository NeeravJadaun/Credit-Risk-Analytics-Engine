[project]
name = "credit-risk-monitoring-platform"
version = "0.1.0"
description = "Educational credit-risk monitoring simulation on the public UCI credit card dataset. Not a production or bank system."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "scikit-learn>=1.5,<1.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyarrow>=16",
  "pyspark==3.5.3",
  "openpyxl>=3.1",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "plotly>=5.22",
  "pyyaml>=6",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs a running PostgreSQL (see scripts/local_postgres.sh)", "integration: needs the real source file and full pipeline outputs"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
