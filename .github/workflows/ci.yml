# First passing run: https://github.com/NeeravJadaun/Credit-Risk-Analytics-Engine/actions/runs/41762845789
# Runs lint and the unit tests. Integration tests need the full dataset and local services.
name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests spark
      - run: JAVA_HOME="$JAVA_HOME" pytest -m "not integration"
